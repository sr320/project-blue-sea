# Core tests run across supported Python versions. A separate workflow job
# exercises the actual DAG with native-format stand-ins; licensed models
# still require a site pilot and independent biological validation.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      # ruff's target-version is pinned to py310 in pyproject, so one
      # interpreter gives the same verdict as all three.
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result; one failure should not mask the others.
      fail-fast: false
      matrix:
        # The floor declared in pyproject, the version the container pins, and
        # the current release.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: pytest -q

  workflow-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev,workflow]'
      - run: pytest -q tests/test_workflow_integration.py
