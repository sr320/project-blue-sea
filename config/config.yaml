# project-blue-sea: antigen discovery pipeline configuration
#
# Data paths are relative to `workdir`; control/source packet paths are
# relative to the invocation directory. Local predictor paths should be absolute.
# Reference data is read-only; scratch is re-creatable; results are durable.

workdir: "."
paths:
  reference: "resources/reference"   # downloaded proteomes, read-only
  scratch: "scratch/pilot"                 # tool output, safe to delete
  results: "results/pilot"                 # ranked lists + dossiers, durable
  cache: "cache/llm"                 # API response cache, durable
  logs: "logs/pilot"

# `accession` and `assembly` together form the NCBI FTP path the download rule
# builds, so they have to be the matching pair for one release -- the config
# previously named UVic_Lsal_1.0 alongside GCA_016086655.3, which is 1.2.
#
# L. salmonis is RefSeq (GCF) rather than GenBank (GCA) on purpose: no
# GCA_016086655.x version carries an annotation, so none of them has a
# proteome to screen. GCF_016086655.4 is the RefSeq annotation of the same
# UVic assembly line, 19,574 protein-coding genes.
species:
  lsal:
    label: "Lepeophtheirus salmonis"
    assembly: "UVic_Lsal_1.4"
    accession: "GCF_016086655.4"
    proteome: "lsal/proteins.faa"
    gff: "lsal/annotation.gff3"
    secretome: null  # reference-relative accession list with primary-source support
    gpi: null        # reference-relative accession list with recorded method
    expression: null # "lsal/stage_tpm.tsv"       # gene_id x life stage, TPM
    rnai: null  # set to a curated local phenotype table when available
    life_stages: [copepodid, chalimus_I, chalimus_II, preadult_I, preadult_II, adult_male, adult_female]
    early_stages: [copepodid, chalimus_I]
  crog:
    label: "Caligus rogercresseyi"
    assembly: "ASM1338718v1"
    accession: "GCA_013387185.1"
    proteome: "crog/proteins.faa"
    gff: "crog/annotation.gff3"
    secretome: null
    gpi: null
    expression: null # "crog/stage_tpm.tsv"
    rnai: null  # no curated phenotype table supplied
    life_stages: [copepodid, chalimus_I, chalimus_II, chalimus_III, chalimus_IV, adult_male, adult_female]
    early_stages: [copepodid, chalimus_I]

host:
  label: "Salmo salar"
  assembly: "Ssal_v3.1"
  accession: "GCF_905237065.1"
  proteome: "ssal/proteins.faa"

# Start with a bounded, reproducible pilot. Full mode requires a passed pilot
# report with matching configuration/weights; see docs/validation.md.
screening:
  mode: pilot
  random_n: 200
  seed: 20261118
  pilot_report: results/pilot/benchmark.json

n_shards: 50
n_shards_candidates: 10

# Commands run in independent working directories. Licensed tools and local
# model files must be installed explicitly; tools-check fails until configured.
predictors:
  signalp:
    version: null
    command: [signalp6, --fastafile, "{input}", --organism, eukarya, --format, none, --output_dir, "{output_dir}"]
    native_output: output/prediction_results.txt
    required_files: []
  deeptmhmm:
    version: null
    command: []  # supply a local driver; output must be predicted_topologies.3line
    native_output: output/predicted_topologies.3line
    required_files: []
  bepipred:
    version: null
    command: [python, -m, bluesea.bepipred, --repo, /opt/predictors/BepiPred-3.0, --esm-model, /opt/predictors/models/esm2_t33_650M_UR50D.pt, --fasta, "{input}", --output-dir, "{output_dir}"]
    native_output: output/raw_output.csv
    required_files: []

# ---------------------------------------------------------------------------
# Filter cascade. Order is cost-ascending: cheap sequence filters run first so
# the expensive predictors only ever see survivors. Each step writes its own
# verdict per protein to the audit log, so any drop is traceable to one rule.
# ---------------------------------------------------------------------------
cascade:
  prefilter:
    # The cascade runs in two phases. Length, low-complexity and exposure need
    # only SignalP and DeepTMHMM, which run proteome-wide because exposure is
    # built on them; epitope prediction and the salmon search then run on the
    # survivors alone -- roughly one protein in nine.
    #
    # Setting this false sends the whole proteome to those predictors instead.
    # That is the expensive way to run and the only way to measure what the
    # exposure filter costs in false negatives, which the README calls the
    # largest such source in the screen. Pair it with `cascade --profile`.
    enabled: true
  length:
    min_aa: 50
    max_aa: 2000
  exposure:
    # A protein passes if it is predicted secreted, or is a membrane protein
    # with a sufficient extracellular/lumenal loop to carry epitopes.
    signalp_min_prob: 0.5
    min_extracellular_aa: 50
    allow_gpi_anchored: true
    # Non-classical secretion is weaker evidence; kept, but flagged.
    accept_nonclassical: true
  host_similarity:
    # Hard exclusion. A candidate with this much identity to any salmon protein
    # risks raising autoantibodies in the vaccinated fish.
    max_identity_pct: 40.0 # heuristic homology exclusion, not a safety guarantee
    max_evalue: 1.0e-5
    min_query_coverage: 0.30
  low_complexity:
    max_fraction: 0.5
  epitope:
    hard_filter: false  # uncertain transfer to salmon; advisory by default
    min_length: 7
    min_linear_epitopes: 2
    min_epitope_score: 0.5
    window: 15
  expression:
    min_tpm: 1.0
    min_stages_expressed: 2
  transmembrane:
    # Expressibility guard, not an exclusion: >4 TM domains is hard to produce
    # recombinantly, but such proteins stay in the list with a scoring penalty.
    warn_above: 4

orthology:
  # Reciprocal best hits between the two louse proteomes.
  min_identity_pct: 30.0
  max_evalue: 1.0e-10
  # Conservation must hold where it matters: across predicted epitopes.
  epitope_region_min_identity_pct: 50.0
  epitope_region_min_coverage: 0.8

llm:
  model: "claude-opus-4-6"
  max_tokens: 4096
  temperature: 0.0
  cache: true
  dry_run: true          # default; flip explicitly for a spending run
  budget_usd:
    annotation: 40.0
    literature: 220.0
    dossier: 80.0
    symbiont: 60.0       # hard cap, <=15% of total
  # Literature retrieval terms excluded during positive-control benchmarking,
  # so a known antigen cannot score highly just by being a known antigen.
  blinded_terms:
    - vaccine
    - vaccination
    - immunization
    - immunisation
    - antigen
    - adjuvant
    - challenge trial

symbiont:
  enabled: true
  # Gate: the track stops here unless the obligate-symbiosis signature appears.
  signature:
    min_completeness: 90.0
    max_contamination: 5.0
    min_populations_present: 3
    max_genome_size_mb: 2.0
    min_prevalence: 0.95
    require_pathway_loss: true
  # Taxa routinely acquired from seawater or salmon mucus; presence alone is
  # not symbiosis, so these are excluded before the signature is evaluated.
  environmental_blocklist:
    - Pseudoalteromonas
    - Vibrio
    - Psychrobacter
    - Flavobacterium

validation:
  construct_controls: resources/controls/experimental_constructs.json
  min_independent_studies: 2
  require_host_spikes: true
  host_spike_n: 3
  positive_controls: "resources/controls/positive_controls.tsv"
  negative_controls: "resources/controls/negative_controls.tsv"
  random_control_n: 200
  random_seed: 20261118
  # The gate: known-working antigens must land in the top tier on deterministic
  # evidence alone, or the rubric is rebuilt before a full run.
  top_tier_fraction: 0.10
  min_positive_controls_in_top_tier: 0.60
  robustness:
    min_mean_stability: 0.8
    min_robust_fraction: 0.5
    weight_perturbation_pct: 20
    n_perturbations: 100
    leave_one_source_out:
      - rnai
      - expression
      - literature
      - epitope
      - orthology
